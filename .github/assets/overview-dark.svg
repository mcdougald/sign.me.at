<svg xmlns="http://www.w3.org/2000/svg" width="880" height="302" viewBox="0 0 880 302" role="img" aria-label="sign.me.at at a glance: A hash-chained trail, A recorded ceremony, Checkable offline, Claims it can back">
<rect x="0.5" y="0.5" width="879" height="301" rx="12" fill="#0a0a0a" stroke="#262626"/>
<rect x="24" y="24" width="196" height="254" rx="10" fill="#171717" stroke="#262626"/>
<text x="44" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#525252">01</text>
<line x1="72" y1="56" x2="200" y2="56" stroke="#404040" stroke-width="1"/>
<text x="44" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#fafafa" font-weight="600"><tspan x="44" dy="0">A hash-chained</tspan><tspan x="44" dy="22">trail</tspan></text>
<text x="44" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a3a3a3"><tspan x="44" dy="0">Every step is a</tspan><tspan x="44" dy="21">chained, hashed</tspan><tspan x="44" dy="21">record of the exact</tspan><tspan x="44" dy="21">bytes stored, and</tspan><tspan x="44" dy="21">reading it recomputes</tspan><tspan x="44" dy="21">the whole chain.</tspan></text>
<rect x="236" y="24" width="196" height="254" rx="10" fill="#171717" stroke="#262626"/>
<text x="256" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#525252">02</text>
<line x1="284" y1="56" x2="412" y2="56" stroke="#404040" stroke-width="1"/>
<text x="256" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#fafafa" font-weight="600"><tspan x="256" dy="0">A recorded</tspan><tspan x="256" dy="22">ceremony</tspan></text>
<text x="256" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a3a3a3"><tspan x="256" dy="0">Consent, an email</tspan><tspan x="256" dy="21">one-time code and</tspan><tspan x="256" dy="21">intent against the</tspan><tspan x="256" dy="21">exact pages shown,</tspan><tspan x="256" dy="21">each as its own chain</tspan><tspan x="256" dy="21">event.</tspan></text>
<rect x="448" y="24" width="196" height="254" rx="10" fill="#171717" stroke="#262626"/>
<text x="468" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#525252">03</text>
<line x1="496" y1="56" x2="624" y2="56" stroke="#404040" stroke-width="1"/>
<text x="468" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#fafafa" font-weight="600"><tspan x="468" dy="0">Checkable</tspan><tspan x="468" dy="22">offline</tspan></text>
<text x="468" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a3a3a3"><tspan x="468" dy="0">A package of plain</tspan><tspan x="468" dy="21">JSON and text files,</tspan><tspan x="468" dy="21">with a VERIFY.txt,</tspan><tspan x="468" dy="21">that the other party</tspan><tspan x="468" dy="21">can recheck with no</tspan><tspan x="468" dy="21">account.</tspan></text>
<rect x="660" y="24" width="196" height="254" rx="10" fill="#171717" stroke="#262626"/>
<text x="680" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#525252">04</text>
<line x1="708" y1="56" x2="836" y2="56" stroke="#404040" stroke-width="1"/>
<text x="680" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#fafafa" font-weight="600"><tspan x="680" dy="0">Claims it can</tspan><tspan x="680" dy="22">back</tspan></text>
<text x="680" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a3a3a3"><tspan x="680" dy="0">A claim register</tspan><tspan x="680" dy="21">records what each</tspan><tspan x="680" dy="21">mechanism is worth,</tspan><tspan x="680" dy="21">and guards refuse any</tspan><tspan x="680" dy="21">user-facing copy that</tspan><tspan x="680" dy="21">says more.</tspan></text>
</svg>
